name: ponto_app
description: Controle de Ponto Individual com Banco de Horas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados local
  sqflite: ^2.3.2
  path: ^1.9.0

  # Câmera e imagens
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  flutter_image_compress: ^2.4.0

  # OCR e ML Kit
  google_mlkit_text_recognition: ^0.15.1

  # Gerenciamento de estado
  provider: ^6.1.2

  # UI
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

  # Permissões
  permission_handler: ^11.3.1

  shared_preferences: ^2.3.3

  share_plus: ^10.1.4
  file_picker: ^8.1.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
